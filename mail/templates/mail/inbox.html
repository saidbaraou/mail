{% extends "mail/layout.html" %}
{% load static %}

{% block body %}
<h2>{{ request.user.email }}</h2>

<nav id="navigation-menu" class="d-flex flex-row flex-nowrap overflow-auto py-3 mb-4 border-bottom">

    <button class="btn btn-outline-primary d-flex align-items-center mr-2" id="inbox">
        <span class="material-symbols-outlined mr-1">inbox</span> Inbox
    </button>

    <button class="btn btn-outline-primary d-flex align-items-center mr-2" id="compose">
        <span class="material-symbols-outlined mr-1">edit_note</span> Compose
    </button>

    <button class="btn btn-outline-primary d-flex align-items-center mr-2" id="sent">
        <span class="material-symbols-outlined mr-1">send</span> Sent
    </button>

    <button class="btn btn-outline-primary d-flex align-items-center mr-2" id="archived">
        <span class="material-symbols-outlined mr-1">archive</span> Archived
    </button>

    <a class="btn btn-outline-danger d-flex align-items-center ml-auto" href="{% url 'logout' %}">
        <span class="material-symbols-outlined mr-1">logout</span> Log Out
    </a>

</nav>

<div id="emails-view">

</div>

<div id="single-email-view"></div>

<div id="compose-view">
    <h3>New Email</h3>
    <form id="compose-form">
        <div class="form-group">
            From: <input disabled class="form-control" value="{{ request.user.email }}" name="sender">
        </div>
        <div class="form-group">
            To: <input id="compose-recipients" class="form-control" name="recipient">
        </div>
        <div class="form-group">
            <input class="form-control" id="compose-subject" placeholder="Subject" name="subject">
        </div>
        <textarea class="form-control mb-3" id="compose-body" placeholder="Body"></textarea>
        <input type="submit" class="btn btn-primary" value="Send" />
    </form>
</div>
{% endblock %}

{% block script %}
<script src="{% static 'mail/inbox.js' %}"></script>
{% endblock %}
